<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Kaushal Suryawanshi, Freelance Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.45">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .float { animation: float 6s ease-in-out infinite; }
    .float.d2 { animation-delay: -3s; }
    @keyframes float { 50% { transform: translateY(-10px); } }
    .role { opacity: 0; animation: roles 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes roles { 0% { opacity: 0; transform: translateY(8px); } 3%, 22% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; transform: translateY(-8px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 74px 233px; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow1)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>

    <!-- Left: name and rotating roles -->
    <text x="64" y="70" class="mono" font-size="18" fill="#94a3b8">&lt;hello world /&gt; I'm</text>
    <text x="62" y="138" class="sans" font-size="62" font-weight="800" fill="url(#name)">Kaushal Suryawanshi</text>
    <g class="mono" font-size="26" fill="#e2e8f0">
      <text x="64" y="188" fill="#7dd3fc">&gt;</text>
      <text x="92" y="188" class="role r1">Freelance Web Developer</text>
      <text x="92" y="188" class="role r2">I build apps businesses actually use</text>
      <text x="92" y="188" class="role r3">JavaScript · Python · React · FastAPI</text>
      <text x="92" y="188" class="role r4">Open to projects &amp; job offers</text>
    </g>
    <circle cx="74" cy="233" r="7" fill="#22c55e" class="pulse"/>
    <text x="90" y="239" class="sans" font-size="17" fill="#cbd5e1">Available for freelance work &amp; full-time roles</text>

    <!-- Right: code window -->
    <g transform="translate(810 46)"><g class="float">
      <rect width="340" height="196" rx="14" fill="#0f172a" stroke="#334155"/>
      <circle cx="22" cy="20" r="6" fill="#f87171"/><circle cx="42" cy="20" r="6" fill="#fbbf24"/><circle cx="62" cy="20" r="6" fill="#34d399"/>
      <text x="200" y="25" class="mono" font-size="12" fill="#64748b">kaushal.js</text>
      <g class="mono" font-size="14">
        <text x="20" y="62"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> kaushal = {</tspan></text>
        <text x="40" y="86"><tspan fill="#7dd3fc">role</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Freelance Dev"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="40" y="110"><tspan fill="#7dd3fc">builds</tspan><tspan fill="#e2e8f0">: [</tspan><tspan fill="#86efac">"web apps"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"AI"</tspan><tspan fill="#e2e8f0">],</tspan></text>
        <text x="40" y="134"><tspan fill="#7dd3fc">openToWork</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#fbbf24">true</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="20" y="158"><tspan fill="#e2e8f0">};</tspan><tspan fill="#7dd3fc" class="cursor"> ▌</tspan></text>
      </g>
    </g></g>
    <g transform="translate(1010 228)"><g class="float d2">
      <rect width="150" height="44" rx="22" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="75" y="28" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#c7d2fe">🚀 Let's build</text>
    </g></g>
  </g>
</svg>
